name: ai-manager-backend
app: dockerfile
options:
  ports: 8000
  dockerfile: backend/Dockerfile
  env:
    - name: PORT
      value: "8000"
    - name: APP_OLLAMA_BASE_URL
      value: "https://your-ollama-server.example.com"
    - name: APP_OLLAMA_MODEL
      value: "qwen3.5:9b"
    - name: APP_CORS_ORIGINS
      value: '["https://your-frontend-domain.example.com"]'
context:
  git:
    url: https://github.com/ssokjiwon/AI-manager.git
    branch: main
  preset: dockerfile
